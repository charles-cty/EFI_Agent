[package]
name = "efi-agent-uefi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
efi-agent-core.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
uefi-raw = "0.17"
uefi = { version = "0.41", features = ["alloc", "global_allocator", "panic_handler"] }
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["alloc", "tls12"] }
webpki-roots = { version = "1", default-features = false }
getrandom = { version = "0.2", features = ["custom"] }
