[workspace]
members = ["crates/core", "crates/uefi", "crates/launcher", "crates/wasm", "crates/filesystem"]
exclude = ["vendor/fatfs", "vendor/wasmi_core"]
default-members = ["crates/core", "crates/launcher", "crates/wasm", "crates/filesystem"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
efi-agent-core = { path = "crates/core" }
efi-agent-filesystem = { path = "crates/filesystem" }
ratatui = { version = "0.30.2", default-features = false, features = ["unstable-rendered-line-info"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
wasmi_core = { path = "vendor/wasmi_core" }
