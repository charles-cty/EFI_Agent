[workspace]
members = ["crates/core", "crates/uefi", "crates/launcher"]
exclude = ["vendor/fatfs"]
default-members = ["crates/core", "crates/launcher"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
efi-agent-core = { path = "crates/core" }
ratatui = { version = "0.30.2", default-features = false, features = ["unstable-rendered-line-info"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
